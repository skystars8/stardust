[package]
name = "aes"
version = "1.0.0"
edition = "2024"
rust-version = "1.97.1"
description = "Bulletproof AES-256-GCM-SIV file encryption/decryption CLI. Processes entirely in memory. Requires key.key (exactly 32 bytes) in the working directory. Input and output must be simple filenames in the same directory (no paths)."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["aes", "gcm-siv", "encryption", "cli", "aead"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
aes-gcm-siv = { version = "0.11.1", features = ["std"] }
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
rand_core = "0.6"
zeroize = "1.8"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
