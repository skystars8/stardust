[package]
name = "secure"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Reliable, streaming file encryption command-line utility"
license = "MIT OR Apache-2.0"

[dependencies]
aes-gcm-siv = "=0.11.1"
anyhow = "=1.0.104"
argon2 = { version = "=0.5.3", features = ["zeroize"] }
blake3 = { version = "=1.8.5", features = ["zeroize"] }
chacha20poly1305 = "=0.10.1"
clap = { version = "=4.6.0", features = ["derive"] }
ctrlc = "=3.5.2"
getrandom = "=0.3.4"
hmac = "=0.12.1"
rpassword = "=7.4.0"
serpent = { version = "=0.6.0", features = ["zeroize"] }
sha2 = "=0.10.9"
tempfile = "=3.27.0"
threefish = { version = "=0.6.0", features = ["zeroize"] }
zeroize = "=1.8.2"

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true
