[package]
name = "encrypt"
version = "1.0.0"
edition = "2024"
rust-version = "1.97.1"
description = "Production-grade streaming encryption CLI (OTP, AES-256-GCM-SIV, XChaCha20-Poly1305, Serpent-256, Threefish-1024)"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
anyhow = "1"
aes-gcm-siv = "0.11.1"
argon2 = { version = "0.5.3", features = ["std"] }
blake3 = "1.8"
chacha20poly1305 = "0.10.1"
cipher = "0.4"
clap = { version = "4.5", features = ["derive"] }
hmac = "0.12"
rand = "0.8"
rpassword = "7.4"
serpent = "0.5"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
threefish = "0.5"
zeroize = { version = "1.8", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
