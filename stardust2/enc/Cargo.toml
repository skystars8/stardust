[package]
name = "enc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A small, fail-safe authenticated file encryption CLI"
license = "MIT"

[dependencies]
anyhow = "1.0"
chacha20poly1305 = { version = "0.10", features = ["std"] }
getrandom = "0.4"
tempfile = "3.20"
zeroize = "1.8"

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
